name: 法律条文定期存档

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      # 不再使用 actions/checkout@v4，直接用 Shell 抓取代码
      - name: 原生克隆仓库
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
          
      - name: 1. 向 Wayback Machine 发送快照请求
        run: |
          curl -s -I "https://web.archive.org/save/https://chinacriminallaw.miraheze.org/wiki/%E4%BC%97%E7%AD%91%E5%88%91%E6%B3%95"

      - name: 2. 抓取 Wiki 源码并按日期命名
        run: |
          mkdir -p backups
          DATE_STR=$(date +'%Y-%m-%d')
          FILENAME="backups/众筑刑法_${DATE_STR}.md"
          curl -L "https://chinacriminallaw.miraheze.org/wiki/%E4%BC%97%E7%AD%91%E5%88%91%E6%B3%95?action=raw" -o "$FILENAME"
          cp "$FILENAME" backups/众筑刑法_Latest.md

      - name: 3. 原生 Git 提交推送
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add backups/
          
          # 核心修正：使用 --allow-empty 
          # 这样即便没有任何文件变化，也会强行生成一个提交记录，证明“今天也来查过了”
          git commit --allow-empty -m "定期存档：$(date +'%Y-%m-%d %H:%M:%S')"
          
          # 推送时确保目标是 origin main
          git push origin main

      - name: 4. 上传至 IPFS (分布式存储)
        id: ipfs
        uses: aquiladev/ipfs-action@v0.3.1
        with:
          path: backups/众筑刑法_${{ env.DATE_STR }}.md
          service: pinata
          pinataJwt: ${{ secrets.PINATA_JWT }}
          pinataPinName: "众筑刑法备份_${{ env.DATE_STR }}"

      - name: 打印 IPFS 地址
        run: |
          echo "文件已上链！CID 为: ${{ steps.ipfs.outputs.cid }}"
          echo "你可以通过以下网关查看: https://ipfs.io/ipfs/${{ steps.ipfs.outputs.cid }}"
